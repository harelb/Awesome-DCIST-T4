---
# offline_meridian_flat_trav.yaml + open-vocabulary regions (zz_regions), v2 prompts:
# multi-phrase site wording per name (fusion/regions_prompts_v2/C.json), top_k 1, max_delta 0.01.
# Offline fusion anchored to GPS: every robot is aligned to the GPS (UTM / ENU) frame and
# gets position priors on its agent poses, so no robot is anchored at the origin and the
# loop-closure initial alignment (which re-anchors robots to a reference robot) is off.
# Inputs need <input>/gps.csv (timestamp_ns,latitude,longitude,altitude,status,cov_xx,cov_yy,cov_zz).
backend:
  type: MultiBackendModule
  anchor_robot_id: -1
  torn_face_stretch_ratio: 3.0  # drop faces with an edge stretched > 3x by the deformation
  torn_face_min_edge_m: 0.5     # ... and longer than 0.5 m (frontend edges are <= 0.2 m)
  rotate_place_boundaries: true  # place radii are world-frame angles: rotate them with world_T_robot
  gps:
    enable: true
    min_sigma_m: 0.1
    sigma_scale: 1.0
    use_altitude: true  # flat site: meridian fixes carry a constant ground altitude (sigma in gps.csv)
    altitude_sigma_m: 100.0
    max_time_diff_s: 1.0
    known_inlier_max_sigma_m: -1.0
    min_alignment_fixes: 10
    alignment_inlier_threshold_m: 3.0
    align_yaw_only: true
    gravity_sigma: 0.02
    min_alignment_loop_closures: 3
    loop_closure_gate_m: 5.0
    coarse_gate_m: 20.0
  add_places_to_deformation_graph: false
  optimize_on_lc: true
  enable_node_merging: true
  update_functors:
    agents:
      type: UpdateAgentsFunctor
    objects:
      type: UpdateObjectsFunctor
      merge_exclusion_metadata_key: awcd_change  # objects changed between sessions never merge
    surface_places:  # MESH_PLACES holds region-growing traversability places, deformed like in the per-robot backend
      # merges places of different robots / passes that cover the same ground (union footprint)
      type: UpdateMultiTraversabilityFunctor
      layer: MESH_PLACES
      merge_places: true
      merge_same_robot: true
      min_overlap: 0.3  # of the smaller place
      trim_overlaps: true
      max_merge_iterations: 5
    places:
      type: UpdatePlacesFunctor
    # Open-vocabulary regions (layer 4 / ROOMS) over the traversability places (MESH_PLACES),
    # replacing the rooms/buildings functors (rooms target the same layer from the empty 3D
    # PLACES layer; buildings would parent stale regions). Named zz_* because DsgUpdater runs
    # functors in alphabetical order, so this runs after surface_places (and its merges).
    # Queries: SigLIP2 so400m-patch16-naflex text embeddings (4 templates averaged) with the
    # mean Penn keyframe image embedding projected out (scripts/gps_fusion/regions/embed_prompts.py
    # --debias); place features: visibility-weighted mean SigLIP2 keyframe embeddings
    # (scripts/gps_fusion/regions/place_features.py). Thresholds retuned for SigLIP2.
    zz_regions:
      type: OpenVocabRegionsUpdateFunctor
      verbosity: 1
      source_layer: MESH_PLACES
      target_layer: ROOMS
      min_num_nodes: 5
      clustering:
        type: AgglomerativeIBClustering
        verbosity: 1
        max_delta: 0.01
        score_threshold: 0.01
        top_k: 1  # v2: one-hot p(y|x): same-label neighbours merge at ~zero cost, regions follow label areas
        cumulative: true
        null_task_preprune: true
        queries:
          embeddings:
          - [-0.0074908, 0.0060542, -0.0064333, -0.0141059, 0.0066351, 0.0210721, 0.0264158, -0.3932206, 0.0155243, 0.0017269, -0.0125043, -0.0314799, 0.025095, -0.0071707, 0.0054165, -0.012996, -0.0160359, 0.0335113, -0.0098443, 0.0114063, -0.0212046, 0.1034698, -0.0099156, 0.0021835, 0.0045505, 0.0169263, 0.0701495, -0.0205056, 0.009552, -0.0170414, 0.0110953, 0.0067342, -0.0084095, -0.0054647, -0.0009887, 0.0183977, 0.0151819, 0.040613, 0.0074059, 0.0070298, 0.011041, 0.0088162, 0.0064933, -0.0143449, 0.0359198, -0.0374257, -0.0297968, 0.0204648, -0.0317715, -0.0021482, 0.001753, 0.0084415, 0.03963, 0.0185293, 0.0095177, 0.0060814, -0.0177315, 0.0155082, -0.0180271, 0.0334245, -0.0318719, 0.0132423, 0.013598, -0.007576, -0.0041382, -0.0257441, 0.0037033, 0.0498154, 0.010384, 0.0091695, 0.0215067, 0.0005018, -0.0113005, -0.0107345, -0.0067594, -0.03898, 0.0121417, 0.0185445, -0.0147137, 0.0141215, 0.02538, 0.0040497, 0.0212915, -0.0091775, -0.0044811, -0.0243368, 0.0282822, -0.0424507, -0.0520352, 0.0139138, 0.0019645, -0.0067199, 0.0031059, -0.0005307, 0.0458261, -0.0040953, 0.0095135, -0.0435228, 0.0266107, -0.0105409, 0.0386, 0.0075624, -0.0134721, 0.0071663, -0.006435, 0.019688, -0.0370306, -0.0171912, 0.0186436, -0.025774, -0.0150597, 0.0029266, -0.0252921, -0.0106708, 0.0079682, 0.030012, -0.0324974, -0.0023353, 0.0034323, -0.0090212, 0.0156721, 0.0019586, 0.0187326, 0.028576, -0.0079251, 0.0369376, -0.0179562, -0.0024612, 0.0040199, -0.0112683, -0.03008, 0.015574, 0.0146176, 0.0436376, 0.0255163, -0.0167667, -0.0027904, 0.2787121, 0.0377017, -0.0288417, -0.0170186, 0.0076857, -0.0379219, 0.0326932, -0.0190108, -0.0005127, -0.0296057, -0.0168184, -0.022426, -0.0056796, 0.0054335, -0.026312, 0.0076774, 0.0002889, -0.01848, 0.014855, -0.0417863, 0.0064727, -0.0034522, 0.0103425, -0.0009785, 0.0008802, -0.004897, 0.0114905, -0.0153536, -0.0172369, 0.0049594, -0.020982, -0.0167407, 0.0010294, -0.0132604, 0.0239739, 0.0204417, 0.0267308, -0.0224082, 0.0122332, 0.