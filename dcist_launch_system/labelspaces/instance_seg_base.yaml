# BASE variant of instance_seg.yaml (2026-08-24): the closed-set labelspace
# as it stood BEFORE the bldg45f6 belief-planning classes (ids 54-57) were
# appended. Used by the *_gt_base sessions to build a PRIOR MAP that is
# deliberately vocabulary-blind to coffee_machine / microwave / notebook /
# computer: dcist_sim still renders those ids into gt_image_raw, but hydra
# has no entry for them, so they never become DSG objects — while the RGB
# keyframes still image them for later open-vocab reprocessing (SAM3).
# This is the closed-vs-open-set premise of the two-stacks-one-robot plan,
# phase 0. Keep ids 0-24 in LOCKSTEP with instance_seg.yaml; never re-add
# 54-57 here — that would defeat the file's purpose.
