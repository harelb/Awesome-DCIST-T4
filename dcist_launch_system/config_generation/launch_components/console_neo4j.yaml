---
windows:
  - window_name: console
    shell_command_before: source ${ADT4_WS}/install/setup.zsh
    layout: tiled
    panes:
      # web console (fleet + map viewer + planning) on http://<base station>:8090,
      # also showing the live Neo4j map that heracles seeds from the prior and updates
      - $ADT4_WS/src/awesome_dcist_t4/adt4_console/bin/adt4-console --port 8090 ${ADT4_PRIOR_MAP:+--map prior=$ADT4_PRIOR_MAP} --neo4j live=${ADT4_NEO4J_URI:-bolt://localhost:7687}
