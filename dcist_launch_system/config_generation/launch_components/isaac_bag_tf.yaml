---
# TF bridge for Isaac-Sim rosbags (dcist_sim_isaac ros_bridge recordings).
#
# Those bags publish an UNNAMESPACED tf tree -- `odom -> body` on /tf and
# `body -> <robot>_camera` on /tf_static -- while the ADT4 stack (hydra.yaml:
# odom_frame/robot_frame) expects `$ADT4_ROBOT_NAME/odom` and
# `$ADT4_ROBOT_NAME/base_link`. These two identity hops splice the bag's tree
# into the namespaced one:
#
#   <robot>/map --(hydra backend)--> <robot>/odom --(here)--> odom
#     --(bag /tf)--> body --(here)--> <robot>/base_link
#                         \--(bag /tf_static)--> <robot>_camera
#
# so hydra resolves both the odometry lookup (<robot>/odom -> <robot>/base_link)
# and the `extrinsics: {type: ros}` camera lookup
# (<robot>/base_link -> <robot>_camera, the camera_info frame_id).
#
# NOTE: play the bag WITHOUT run-adt4's default `--filter-tf -k '.*<robot>.*'`
# keep-filter -- it would drop the bag's `odom` and `body` frames, which do not
# contain the robot name. See the spot_isaac_bag experiment.
windows:
  - window_name: isaac_bag_tf
    shell_command_before: source ${ADT4_WS}/install/setup.zsh
    layout: tiled
    panes:
      - ros2 run tf2_ros static_transform_publisher --frame-id ${ADT4_ROBOT_NAME}/odom --child-frame-id odom
      - ros2 run tf2_ros static_transform_publisher --frame-id body --child-frame-id ${ADT4_ROBOT_NAME}/base_link
