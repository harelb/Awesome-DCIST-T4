---
windows:
  - window_name: sam3_query
    layout: tiled
    panes:
      # warm SAM3 query server (agentic_navigation) on :8077 for the console chat's
      # "search robot images": ranks the map's keyframes (Neo4j image stores + the
      # live fleetlink mirrors under ~/adt4_output/live) and segments with SAM3.
      # Weights come from the local HF cache (no download).
      - cd $ADT4_WS/src/awesome_dcist_t4/agentic_navigation && HF_HUB_OFFLINE=1 HERACLES_NEO4J_URI=${ADT4_NEO4J_URI:-bolt://localhost:7687} $ADT4_ENV/sam3/bin/python -m agentic_navigation.sam3_frontend.query_server --port 8077 --conf 0.25 --live-store-root $HOME/adt4_output/live
