---
nodes_to_monitor:
  spot_executor: {}
environment:
  # every Spot camera for the fleetlink agent (fleetlink.yaml `cameras`); relative to /<robot>
  ADT4_FLEETLINK_CAMERAS: "['rgb=${ADT4_ROBOT_NAME}_zed/rgb/image_rect_color','overlay=semantic_overlay/image_raw','frontleft=frontleft/color/image_raw','frontright=frontright/color/image_raw','left=left/color/image_raw','right=right/color/image_raw','back=back/color/image_raw','hand=hand/color/image_raw']"
windows:
  - window_name: real_spot
    shell_command_before: source ${ADT4_WS}/install/setup.zsh
    layout: tiled
    panes:
      - ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_spot_executor:=true
      - ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_spot_state_publisher:=true launch_calibration_publisher:=true launch_spot_base_link:=true
      - ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_spot_camera_driver:=true launch_spot_camera_decompression:=true
      - ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_livox:=true
      # raw images for the extra Spot cameras (spot_sensor_node.yaml `cameras`; frontleft/frontright are
      # decompressed above): /<robot>/<cam>/color/image_raw for the fleetlink agent (ADT4_FLEETLINK_CAMERAS).
      # republish subscribes lazily, so a camera nobody reads is not decoded. hand idles on a Spot without an arm.
      - for cam in left right back hand; do ros2 run image_transport republish --ros-args -r __ns:=/$ADT4_ROBOT_NAME/$cam -r __node:=${cam}_decompress -p use_sim_time:=$sim_time -p in_transport:=compressed -p out_transport:=raw -r in/compressed:=color/image_raw/compressed -r out:=color/image_raw & done; wait
