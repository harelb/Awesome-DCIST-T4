---
# Static-map Isaac execution side. This deliberately has no Hydra, ROMAN, or
# camera frontend: Isaac publishes GT odometry/TF while Willow plans from the
# saved Heracles graph. Start one isolated run-adt4 session per robot, with
# ADT4_ROBOT_NAME set to either hamilton or euclid.
nodes_to_monitor:
  spot_executor: {}
windows:
  - window_name: isaac_static_executor
    shell_command_before: source ${ADT4_WS}/install/setup.zsh
    layout: tiled
    panes:
      - ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_spot_executor:=true
      - ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_spot_state_publisher:=true launch_calibration_publisher:=true launch_spot_base_link:=true
      - ros2 run dcist_sim_ros auto_approver --ros-args -r __ns:=/$ADT4_ROBOT_NAME -r manipulation_request:=/$ADT4_ROBOT_NAME/spot_executor_node/manipulation_request -r pick_confirmation:=/$ADT4_ROBOT_NAME/spot_executor_node/pick_confirmation
