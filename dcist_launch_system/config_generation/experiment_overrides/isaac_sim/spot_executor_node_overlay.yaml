---
/**:
  ros__parameters:
    spot_interface: sim
    sim_rgb_topic: /$(var robot_name)/$(var robot_name)_zed/rgb/image_rect_color
    body_frame: $(var robot_name)/body
    mid_level_planner_type: identity   # P1: derisk; astar+live-occupancy is a stretch goal
    detector_confidence: 0.02
    # goal_tolerance 1.0 (base_params default is 2.8): the pick-object action
    # sends the robot to the object's DSG position, but the magic-grasp backend
    # only attaches an object within grasp_radius (1.5 m, field_smoke.yaml) of the
    # gripper -- it does NOT walk-in to the detected centroid like the real BD
    # grasp does. With the 2.8 m default the follower stops up to 2.8 m short, so
    # the gripper is beyond the 1.5 m reach and the grasp service returns failure
    # even though YOLOE detected the object. 1.0 m makes the robot approach inside
    # the grasp radius so pick is reliable. Detection range is unaffected (YOLOE
    # sees the object well before the robot arrives). See task-12-report.md.
    goal_tolerance: 1.0
    # Single-quoted keys/values (not double-quoted JSON): the generated params
    # file is loaded via `allow_substs: true` (master.launch.yaml), whose
    # substitution pass strips backslash-escaped double quotes ANYWHERE in the
    # file text (not just inside $(...) tokens) -- a double-quoted-JSON value
    # like '{"bag": "cement bag"}' gets its escaped inner quotes silently
    # stripped after config_generation's YAML round-trip re-quotes it, which
    # corrupts the file into invalid YAML ("substituted parameter file is not
    # a valid yaml file"). Single quotes avoid embedding any backslash at all.
    # Consumer parses this via yaml.safe_load (spot_executor_ros.py), which
    # accepts single-quoted YAML strings fine -- it is not strict JSON.
    # 'box' -> 'cement bag': the live-perception frontend (YOLOE instance-seg,
    # labelspace `instance_seg`) classifies the duffel_bag asset as class `box`
    # (label 17), not `bag`, so the DSG object node -- and hence the planner's
    # Pick.object_class -- is `box` for the field_smoke bag. Mapping `box` to the
    # Task-6-tuned prompt `cement bag` (already registered at detector init via
    # the `bag` synonym) makes the grasp query use the proven detection prompt
    # regardless of whether the frontend labels the duffel `box` or `bag`. It
    # also sidesteps a latent crash in Detector.set_up_detector (detection_utils
    # .py: appends via the low-level `yolo_model.model.set_classes(names)`, which
    # on this ultralytics YOLOE build requires an `embeddings` arg and raises;
    # only reached for a class NOT pre-registered in ["","bag","cone","pipe"]).
    # With the synonym, `box` resolves to the already-registered `cement bag`, so
    # that append path is never taken. See task-12-report.md.
    detector_class_synonyms: "{'bag': 'cement bag', 'pipe': 'gray pipe', 'box': 'cement bag'}"
