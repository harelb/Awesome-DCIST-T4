---
# general config
paths: [khronos, khronos_ros]
robot_id: 0
config_verbosity: 1
map_frame: $<env ADT4_ROBOT_NAME>/map
odom_frame: $<env ADT4_ROBOT_NAME>/odom
robot_frame: $<env ADT4_ROBOT_NAME>/base_link
map_window: {type: spatial, max_radius_m: 12.0}
labelspace: {type: from_msg}
# modules
input:
  type: RosInput
  inputs:
    camera:
      sensor: {type: camera_info, min_range: 0.2, max_range: 7.0, extrinsics: {type: ros}}
      receiver:
        type: ImageReceiver
        verbosity: 1
        semantics_type: instance
        use_exact: true
        queue_size: 30
        filters:
          - {type: InvalidDepthFilter, max_invalid_ratio: 0.5, inf_is_valid: true}
active_window:
  type: ActiveWindow
  # image logging (FORMAT.md): every full-rate input reaches the keyframe selector, and
  # Khronos logs each extracted track's observations; hydra_image_store indexes both
  forward_intermediate_inputs: true
  track_logger: {log_path: $<env ADT4_OUTPUT_DIR>/tracks, max_images_per_object: 1, save_depth: true}
  min_output_separation: 0.5
  volumetric_map: {voxel_size: 0.1, truncation_distance: 0.3, with_semantics: false}
  projective_integrator: {semantic_integrator: {type: SingleLabelIntegrator}, interpolation_method: {type: adaptive, inf_is_free_space: true}}
  object_detector: {type: InstanceForwarding, min_cluster_size: 30, max_range: 7.0, min_range: 0.05, verbosity: 1, instance_filter: {type: CategoryFilter}}
  tracker:
    type: MaxIouTracker
    track_by: voxels
    min_semantic_iou: 0.1
    min_cross_iou: 0.1
    min_num_observations: 15
    verbosity: 0
    preassociate_by_id: true
    voxel_size: 0.1
    accumulate_voxels: true
    min_voxel_hits: 15
    merge_tracks: true
    merge_containment_threshold: 0.35
    merge_distance_factor: 2.0
  object_extractor:
    type: AccumulatedObjectExtractor
    min_object_allocation_confidence: 0.5
    max_object_volume: 50.0
  khronos_sinks:
    - {type: ActiveWindowVisualizer, track_label_min_observations: 15}
  sinks:
    - {type: ReconstructionVisualizer}
    - {type: TsdfOccupancyPublisher, min_distance: 0.25, use_relative_height: true, slice_height: 0.25, num_slices: 4}
  frame_data_buffer:
    max_buffer_size: 600
    store_every_n_frames: 1
  live_accumulated_bounding_box: true
frontend:
  type: GraphBuilder
  # keyframe images: one InputData zip per keyframe (raw logs, indexed into
  # $ADT4_OUTPUT_DIR/image_store by `hydra-image-store tail`, see the hydra window)
  keyframe_selector:
    type: KeyframeSelector
    log_path: $<env ADT4_OUTPUT_DIR>/keyframes
    save_fields: [color, depth]
    keyframe_policy: {type: DistancePolicy, min_pose_separation: 0.25, rotation_separation_weight: 0.0, min_time_separation_s: 0.0, max_time_separation_s: 2.0}
  sinks:  # live event logs (track bindings, agent nodes) for the image-store tail mode
    - {type: FrontendEventLogger, path: $<env ADT4_OUTPUT_DIR>/events/frontend.jsonl}
  # fleetlink sends the mesh it finds in the scene graph
  serialize_dsg_mesh: true
  clear_object_meshes: true
  enable_mesh_objects: false
  pgmo: {time_horizon: 15.0, d_graph_resolution: 2.5}
  mesh_compression: {resolution: 0.005}
  graph_connector:
    layers:
      - {parent_layer: MESH_PLACES, child_layers: [layer: OBJECTS]}
  graph_updater:
    # hydra develop: objects not in an update are archived (was layer_updates.OBJECTS.archive_missing)
    mark_active: false
    layer_updates:
      OBJECTS:
        prefix: O
    #     matcher: {type: IoUNodeMatcher, min_same_iou: 0.2, min_cross_iou: 0.5}
    #     merger: {type: EarliestAttributeMerger}
  traversability_places:
    type: traversability
    layer: MESH_PLACES
    estimator:
      type: GradientTraversabilityEstimator
      gradient_threshold: 0.8
      height_below: 1.0
      height_above: 0.3
      min_confidence: 0.5
      min_traversability: 0.25
      pessimistic: true
      smoothing: true
      sinks:
        - {type: TsdfGradientOccupancyPublisher, gradient_threshold: 0.5, min_confidence: 0.5, filter_disjoint: true}
    clustering: {type: RegionGrowingTraversabilityClustering, max_radius: 4.0}
    # No-op unless with_traversability is enabled (see regions_traversability config).
    persistent_processing:
      - type: RobotFootprintTraversability
        bbox_min: [-0.75, -0.25]
        bbox_max: [0.75, 0.25]
      - type: ProjectiveSemanticTraversabilityIntegrator
        max_range: 3.0
        fusion_mode: MIN
        label_traversability: {0: 1.0, 1: 0.1, 2: 0.1}  # traversable, maybe, not traversable
    sinks:
      - type: TraversabilityVisualizer
backend:
  type: BackendModule
  publish_backend_tf: true
  # fleetlink sends the mesh it finds in the scene graph
  serialize_dsg_mesh: true
  min_dsg_separation_s: 1
  publish_mesh: true
  min_mesh_separation_s: 10
  add_places_to_deformation_graph: false
  optimize_on_lc: true
  # Upstream #154 gated our "solve only on new loop closures" fix behind this flag and
  # defaulted it true, which restores the old have_loopclosures_ latch (a full ~1.86 s
  # PGO solve on EVERY spin once any LC has been seen). false = solve only when new loop
  # closures arrive; the non-solve path still deforms with the cached optimized values.
  optimize_every_update: false
  merge_sinks:  # live backend merge log for the image-store tail mode
    - {type: MergeEventLogger, path: $<env ADT4_OUTPUT_DIR>/events/backend.jsonl}
  update_functors:
    agents: {type: UpdateAgentsFunctor}
    objects: {type: GenericUpdateFunctor, layer: OBJECTS, node_matcher: {type: IoUNodeMatcher, min_same_iou: 0.1, min_cross_iou: 0.3}, merge_proposer: {strategy: {type: Pairwise}}}
    traversability: {type: UpdateRegionGrowingTraversabilityFunctor, layer: MESH_PLACES}
  pgmo:
    run_mode: FULL
    embed_trajectory_delta_t: 5.0
    num_interp_pts: 3
    interp_horizon: 10.0
    add_initial_prior: true
    optimizer:
      type: KimeraRpgoOptimizer
      solver: LM
      gnc: {inlier_probability: 0.9, mu_step: 1.6, max_iterations: 100}
    covariance:
      odom: 1.0e-02
      loop_close: 5.0e-02
      sg_loop_close: 1.0e-01
      prior: 1.0e-02
      mesh_mesh: 1.0e-02
      pose_mesh: 1.0e-02
      place_mesh: 1.0e-02
      place_edge: 10.0
      place_merge: 10.0
      object_merge: 10.0
