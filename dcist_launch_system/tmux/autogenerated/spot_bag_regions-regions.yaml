nodes_to_monitor:
  tf_network: {}
  depth_correction: {}
  fastsam: {}
  roman_map: {}
  roman_lc: {}
  relocalization_monitor:
    external_monitor:
      type: RelocalizationMonitor
  hydra:
    external_monitor:
      type: JsonMonitor
  semantic_inference:
    external_monitor:
      type: JsonMonitor
  nlu_rviz_instruction_panel: {}
  nlu_rviz_manipulation_panel: {}
session_name: adt4_system
suppress_history: false
environment:
  sim_time: $ADT4_SIM_TIME
  ADT4_PRIOR_MAP: $ADT4_PRIOR_MAP
  ADT4_OUTPUT_DIR: $ADT4_OUTPUT_DIR
  HERACLES_NEO4J_USERNAME: $ADT4_NEO4J_USERNAME
  HERACLES_NEO4J_PASSWORD: $ADT4_NEO4J_PASSWORD
  HERACLES_OPENAI_API_KEY: $ADT4_OPENAI_API_KEY
  HERACLES_EVALUATION_PATH: $ADT4_HERACLES_AGENTS_PATH
  ADT4_ORIGIN_UTM: $ADT4_ORIGIN_UTM
  ADT4_NAMESPACE_TF: $ADT4_NAMESPACE_TF
  ADT4_MONITOR_CONFIG: '{nodes_to_track: {depth_correction: {}, fastsam: {}, hydra: {external_monitor: {type: JsonMonitor}}, nlu_rviz_instruction_panel: {}, nlu_rviz_manipulation_panel: {}, relocalization_monitor: {external_monitor: {type: RelocalizationMonitor}}, roman_lc: {}, roman_map: {}, semantic_inference: {external_monitor: {type: JsonMonitor}}, tf_network: {}}}'
  ADT4_ROBOT_NAME: $ADT4_ROBOT_NAME
  config: regions
  logging_key: spot_bag_regions-regions
options:
  default-command: /bin/zsh
windows:
- window_name: core
  layout: tiled
  panes:
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && python3 $ADT4_WS/src/awesome_dcist_t4/dcist_launch_system/scripts/show_environment.py; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'python3 $ADT4_WS/src/awesome_dcist_t4/dcist_launch_system/scripts/show_environment.py'"'"' exec zsh'
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 service call /${ADT4_ROBOT_NAME}/hydra/shutdown std_srvs/Empty && ros2 service call /${ADT4_ROBOT_NAME}/roman/shutdown std_srvs/Empty'"'"' ADT4_PANE_PREFILL=1 exec zsh'
- window_name: status
  layout: tiled
  panes:
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 run ros_system_monitor ros_system_monitor --params $ADT4_MONITOR_CONFIG --name $ADT4_ROBOT_NAME --ros-args -r __ns:=/$ADT4_ROBOT_NAME -r '"'"'~/table_out:=/global/ros_system_monitor/table_in'"'"'; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 run ros_system_monitor ros_system_monitor --params $ADT4_MONITOR_CONFIG --name $ADT4_ROBOT_NAME --ros-args -r __ns:=/$ADT4_ROBOT_NAME -r '"'"'"'"'"'"'"'"'~/table_out:=/global/ros_system_monitor/table_in'"'"'"'"'"'"'"'"''"'"' exec zsh'
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_dsg_analyzer:=true; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_dsg_analyzer:=true'"'"' exec zsh'
- window_name: tf_network
  layout: tiled
  panes:
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_tf_network:=true; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_tf_network:=true'"'"' exec zsh'
- window_name: roman
  layout: tiled
  panes:
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_depth_correction:=true; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_depth_correction:=true'"'"' exec zsh'
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_fastsam:=true; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_fastsam:=true'"'"' exec zsh'
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_roman_map:=true; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_roman_map:=true'"'"' exec zsh'
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_roman_lc:=true; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_roman_lc:=true'"'"' exec zsh'
- window_name: hydra
  layout: tiled
  panes:
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_instance_segmentation:=true; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_instance_segmentation:=true'"'"' exec zsh'
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_clip_features:=true; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_clip_features:=true'"'"' exec zsh'
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_hydra:=true labelspace_name:=instance_seg; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_hydra:=true labelspace_name:=instance_seg'"'"' exec zsh'
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_hydra_visualizer:=true; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_hydra_visualizer:=true'"'"' exec zsh'
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_static_map_to_robot_map:=true; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_static_map_to_robot_map:=true'"'"' exec zsh'
- window_name: rviz
  layout: tiled
  panes:
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_rviz:=true ${ADT4_RVIZ_CONFIG:+rviz_config:=$ADT4_RVIZ_CONFIG}; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_rviz:=true ${ADT4_RVIZ_CONFIG:+rviz_config:=$ADT4_RVIZ_CONFIG}'"'"' exec zsh'
- window_name: bag_spot
  layout: tiled
  panes:
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_spot_state_publisher:=true launch_calibration_publisher:=true launch_spot_base_link:=true; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_spot_state_publisher:=true launch_calibration_publisher:=true launch_spot_base_link:=true'"'"' exec zsh'
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_spot_camera_decompression:=true; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_spot_camera_decompression:=true'"'"' exec zsh'
