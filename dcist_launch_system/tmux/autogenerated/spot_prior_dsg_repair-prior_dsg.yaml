nodes_to_monitor:
  dsg_saver: {}
  omniplanner: {}
  nlu_rviz_instruction_panel: {}
  spot_executor: {}
session_name: adt4_system
suppress_history: false
environment:
  sim_time: $ADT4_SIM_TIME
  ADT4_PRIOR_MAP: $ADT4_PRIOR_MAP
  ADT4_OUTPUT_DIR: $ADT4_OUTPUT_DIR
  HERACLES_NEO4J_USERNAME: $ADT4_NEO4J_USERNAME
  HERACLES_NEO4J_PASSWORD: $ADT4_NEO4J_PASSWORD
  HERACLES_OPENAI_API_KEY: $ADT4_OPENAI_API_KEY
  HERACLES_EVALUATION_PATH: $ADT4_HERACLES_AGENTS_PATH
  ADT4_ORIGIN_UTM: $ADT4_ORIGIN_UTM
  ADT4_NAMESPACE_TF: $ADT4_NAMESPACE_TF
  ADT4_FLEET_LINK: $ADT4_FLEET_LINK
  ADT4_FLEETLINK_CONNECT: $ADT4_FLEETLINK_CONNECT
  ADT4_FLEETLINK_PORT: $ADT4_FLEETLINK_PORT
  ADT4_MONITOR_CONFIG: '{nodes_to_track: {dsg_saver: {}, nlu_rviz_instruction_panel: {}, omniplanner: {}, spot_executor: {}}}'
  ADT4_ROBOT_NAME: $ADT4_ROBOT_NAME
  config: prior_dsg
  logging_key: spot_prior_dsg_repair-prior_dsg
options:
  default-command: /bin/zsh
windows:
- window_name: core
  layout: tiled
  panes:
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && python3 $ADT4_WS/src/awesome_dcist_t4/dcist_launch_system/scripts/show_environment.py; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'python3 $ADT4_WS/src/awesome_dcist_t4/dcist_launch_system/scripts/show_environment.py'"'"' exec zsh'
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 service call /${ADT4_ROBOT_NAME}/hydra/shutdown std_srvs/Empty && ros2 service call /${ADT4_ROBOT_NAME}/roman/shutdown std_srvs/Empty'"'"' ADT4_PANE_PREFILL=1 exec zsh'
- window_name: status
  layout: tiled
  panes:
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 run ros_system_monitor ros_system_monitor --params $ADT4_MONITOR_CONFIG --name $ADT4_ROBOT_NAME --ros-args -r __ns:=/$ADT4_ROBOT_NAME -r '"'"'~/table_out:=/global/ros_system_monitor/table_in'"'"'; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 run ros_system_monitor ros_system_monitor --params $ADT4_MONITOR_CONFIG --name $ADT4_ROBOT_NAME --ros-args -r __ns:=/$ADT4_ROBOT_NAME -r '"'"'"'"'"'"'"'"'~/table_out:=/global/ros_system_monitor/table_in'"'"'"'"'"'"'"'"''"'"' exec zsh'
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_dsg_analyzer:=true; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_dsg_analyzer:=true'"'"' exec zsh'
- window_name: prior_dsg
  layout: tiled
  panes:
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_scene_graph_publisher:=true; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_scene_graph_publisher:=true'"'"' exec zsh'
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_mesh_publisher:=true; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_mesh_publisher:=true'"'"' exec zsh'
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_hydra_visualizer:=true; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_hydra_visualizer:=true'"'"' exec zsh'
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_dsg_saver:=true; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_dsg_saver:=true'"'"' exec zsh'
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_awcd_visualizer:=true; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_awcd_visualizer:=true'"'"' exec zsh'
- window_name: planning
  layout: tiled
  panes:
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_rviz:=true ${ADT4_RVIZ_CONFIG:+rviz_config:=$ADT4_RVIZ_CONFIG}; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_rviz:=true ${ADT4_RVIZ_CONFIG:+rviz_config:=$ADT4_RVIZ_CONFIG}'"'"' exec zsh'
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_omniplanner_repair:=true; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_omniplanner_repair:=true'"'"' exec zsh'
- window_name: fleetlink_base
  layout: tiled
  panes:
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && if [ "$ADT4_FLEET_LINK" = fleetlink ]; then $ADT4_WS/src/awesome_dcist_t4/fleetlink/bin/fleetlink-router ${ADT4_FLEETLINK_PORT:-7450}; else echo "fleetlink-router not started (ADT4_FLEET_LINK=$ADT4_FLEET_LINK; router mode)"; fi; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'if [ "$ADT4_FLEET_LINK" = fleetlink ]; then $ADT4_WS/src/awesome_dcist_t4/fleetlink/bin/fleetlink-router ${ADT4_FLEETLINK_PORT:-7450}; else echo "fleetlink-router not started (ADT4_FLEET_LINK=$ADT4_FLEET_LINK; router mode)"; fi'"'"' exec zsh'
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && if [ "$ADT4_FLEET_LINK" = fleetlink ]; then $ADT4_WS/src/awesome_dcist_t4/fleetlink/bin/fleetlink-bridge --ros-args -r /tf:=$([[ $ADT4_NAMESPACE_TF == false ]] && echo /tf || echo /$ADT4_ROBOT_NAME/tf) -r /tf_static:=$([[ $ADT4_NAMESPACE_TF == false ]] && echo /tf_static || echo /$ADT4_ROBOT_NAME/tf_static) -p use_sim_time:=$sim_time -p zenoh_connect:=${ADT4_FLEETLINK_CONNECT:-tcp/127.0.0.1:7450} -p topology:=${ADT4_TOPOLOGY:-$ADT4_WS/src/awesome_dcist_t4/network_diagnostics/config/topology.yaml} -p relay_config:=$ADT4_WS/src/awesome_dcist_t4/fleetlink/config/relay.yaml -p base_name:=$ADT4_ROBOT_NAME; else echo "fleetlink-bridge not started (ADT4_FLEET_LINK=$ADT4_FLEET_LINK; router mode)"; fi; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'if [ "$ADT4_FLEET_LINK" = fleetlink ]; then $ADT4_WS/src/awesome_dcist_t4/fleetlink/bin/fleetlink-bridge --ros-args -r /tf:=$([[ $ADT4_NAMESPACE_TF == false ]] && echo /tf || echo /$ADT4_ROBOT_NAME/tf) -r /tf_static:=$([[ $ADT4_NAMESPACE_TF == false ]] && echo /tf_static || echo /$ADT4_ROBOT_NAME/tf_static) -p use_sim_time:=$sim_time -p zenoh_connect:=${ADT4_FLEETLINK_CONNECT:-tcp/127.0.0.1:7450} -p topology:=${ADT4_TOPOLOGY:-$ADT4_WS/src/awesome_dcist_t4/network_diagnostics/config/topology.yaml} -p relay_config:=$ADT4_WS/src/awesome_dcist_t4/fleetlink/config/relay.yaml -p base_name:=$ADT4_ROBOT_NAME; else echo "fleetlink-bridge not started (ADT4_FLEET_LINK=$ADT4_FLEET_LINK; router mode)"; fi'"'"' exec zsh'
- window_name: sim_spot
  layout: tiled
  panes:
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_spot_executor:=true; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_spot_executor:=true'"'"' exec zsh'
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_spot_state_publisher:=true launch_calibration_publisher:=true launch_spot_base_link:=true; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_spot_state_publisher:=true launch_calibration_publisher:=true launch_spot_base_link:=true'"'"' exec zsh'
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_static_map_to_robot_map:=true launch_static_robot_map_to_odom:=true; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 launch dcist_launch_system master.launch.yaml conf_name:=$config sim_time:=$sim_time robot_name:=$ADT4_ROBOT_NAME launch_static_map_to_robot_map:=true launch_static_robot_map_to_odom:=true'"'"' exec zsh'
  - shell: zsh -ic 'source ${ADT4_WS}/install/setup.zsh && ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -r /cmd_vel:=/$ADT4_ROBOT_NAME/spot_executor_node/cmd_vel; z="${ADT4_WS}/src/awesome_dcist_t4/dcist_launch_system/config_generation/pane_shell"; [[ -r $z/.zshrc ]] && export _ADT4_ZDOTDIR="${ZDOTDIR-}" ZDOTDIR=$z; ADT4_PANE_CMD='"'"'ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -r /cmd_vel:=/$ADT4_ROBOT_NAME/spot_executor_node/cmd_vel'"'"' exec zsh'
