# Task 10: Phase-1 outdoor field scenario. `hilbert` spawns at the origin
# facing +X (yaw 0.0 -- see spot_robot.py's `_yaw_to_quat_wxyz`, a pure Z
# rotation, so yaw=0 keeps the robot's body +X aligned with world +X).
# All three graspable objects are placed within roughly +/-25 degrees of
# that forward heading so they fall inside a single robot-camera frame
# (SimZedCamera's real ~101 degree horizontal FOV, derived from
# camera.py's FX=261.93 at IMAGE_WIDTH=640 -- see task-10-report.md) without
# requiring the robot to turn -- verified by the render+YOLOE spot-check in
# task-10-report.md.
#
# Labels are the CANONICAL class names (`bag`, `cone`, `pipe`) used
# throughout the scenario/grasp-target stack. They deliberately do NOT
# encode the YOLOE vocabulary fix from Task 6b/6c (`"bag"->"cement bag"`,
# `"pipe"->"gray pipe"`, conf=0.02) -- that translation lives in
# `spot_executor_ros`'s `detector_class_synonyms`/`detector_confidence`
# params (Task 6c), not baked into scenario data.
#
# DEVIATION from the task-10 brief's suggested distances ("bag_0 ~8m ...,
# cone_0/pipe_0 scattered 5-12m"): empirically, at those distances the real
# SimZedCamera contract (640x360, FX=261.93 -- Task 8, ~4x lower angular
# resolution than the synthetic 1280x720/~60deg-FOV camera Task 6's
# render_gate.py used to find the winning YOLOE config) does NOT clear the
# detection bar -- an 8-9.5m spot-check got zero bag/pipe hits in 3/3
# frames (only cone, at low confidence). Objects were pulled in to
# ~4.3-5.8m, which restores a comfortable confidence margin above the
# winning config's conf=0.02 threshold for all three classes (see
# task-10-report.md's distance sweep: 3.2-4.5m and 4.3-5.8m both pass
# with margin; ~6.6-7.5m still passes but with the pipe/bag confidences
# down near the cutoff; 8-9.5m fails outright). This does not defeat the
# scenario's purpose -- `grasp_radius: 1.5` below means the robot must
# still navigate closer to actually grasp anything regardless of its
# initial spawn-to-object distance, so this is a "can the robot see it
# from spawn" tuning, not a "the robot starts right on top of it" one.
environment:
  usd: assets/environments/field_a.usd
robots:
  - name: hilbert
    spawn: {x: 0.0, y: 0.0, z: 0.52, yaw: 0.0}
    locomotion: kinematic
    grasping: magic
objects:
  # ~5m ahead and slightly right, in open view (no other object/rock
  # between it and spawn) -- see the DEVIATION note above for why this is
  # closer than the brief's original "~8m".
  - id: bag_0
    usd: assets/objects/duffel_bag.usd
    label: bag
    # yaw is RADIANS (scenario.py); 0.52 rad ~= 30 deg -- cosmetic prop
    # orientation only, kept close to the original visual intent.
    pose: {x: 5.0, y: 0.6, z: 0.0, yaw: 0.52}
  # Scattered off to either side of the bag, both still inside the same
  # forward camera cone as bag_0 (see header comment) and within the
  # empirically-verified detection range.
  - id: cone_0
    usd: assets/objects/cone.usd
    label: cone
    pose: {x: 4.0, y: 1.6, z: 0.0, yaw: 0.0}
  - id: pipe_0
    usd: assets/objects/pipe.usd
    label: pipe
    # objects/pipe.usd bakes the raw Nucleus tube asset's 4x graspable-size
    # scale-up *and* the offset that puts its bottom at the wrapper's local
    # z=0 (see build_field_a_assets.py) -- z: 0.0 here sits it exactly on
    # the ground, unlike render_gate.py's original unwrapped placement
    # (z=0.04) which left the pipe floating ~4cm above its ground quad.
    # yaw is RADIANS (scenario.py); 1.57 rad ~= 90 deg -- cosmetic prop
    # orientation only, kept close to the original visual intent.
    pose: {x: 5.6, y: -1.6, z: 0.0, yaw: 1.57}
# Task 9's magic-grasp selection radius (grasp.py's select_grasp_target),
# meters from the gripper. Explicit here (equal to the loader default) so
# the scenario documents its own grasp-reach assumption rather than relying
# on scenario.py's DEFAULT_GRASP_RADIUS silently.
grasp_radius: 1.5
