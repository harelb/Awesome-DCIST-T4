# Physics-tier full-coverage warehouse mapping tour (Task 16, Isaac Phase 4).
#
# Derived from warehouse_tour_full.yaml (same warehouse_a environment, objects,
# and GT) but retiered for PHYSICS: locomotion: policy (the SpotFlatTerrainPolicy
# walker, Tasks 8/9) instead of kinematic, so the tour must stay in navigable
# free space -- the robot really walks and a real local planner (costmap A*,
# Tasks 3-5) routes it. Grasping stays magic (mapping never grasps; magic keeps
# the scenario simple -- spec §2).
#
# TOUR AUTHORING (Task 16 authored aisles; Task 17 RE-AUTHORED, open-floor only):
#   18-waypoint boustrophedon over the OPEN LOWER FLOOR (world X[-24,+3],
#   Y[-21,+6]) at columns x = +3, -2/-3, -8, -14, -19, -24 and rows y = 6, -8,
#   -21. It deliberately does NOT enter the upper rack zone (Y > ~9): the narrow
#   rack aisles need detour paths the pretrained flat-terrain policy tracks poorly
#   (base jams against a rack). World interior is X[-26,+5], Y[-24,+30]; the upper
#   half (Y ~ 11..25) holds 7 rack rows, seen here from the y=6 row looking north.
#
#   TASK 17 FIX (docs/sim_runbook.md §12.19). The original Task-16 waypoints were
#   only checked for a 1-cell margin (render_costmap.py --check verifies the
#   waypoint CELL + its 8 neighbours are free). That is insufficient for a
#   WALKING policy robot under two effects that landed AFTER Task 16 authored the
#   tour: (a) the executor follower stops within its goal_tolerance (1.0 m) of the
#   goal, so a waypoint only 0.2-0.5 m from inflation lets the base PARK inside an
#   inflated obstacle; and (b) Task 15i bakes per-object footprints into the
#   costmap, so the origin object cluster (bag/cone) now inflates over the nearby
#   waypoint. `local_planner.astar` refuses to plan from an OCCUPIED start cell
#   (no start-snap), so a base parked in inflation is permanently BLOCKED -- the
#   A2 run got stuck at the old (-2, 6) waypoint (0.2 m clearance) beside bag_0.
#   Re-authored so EVERY waypoint has >= 1.5 m clearance to the nearest inflated
#   obstacle (distance transform of the run's own footprint-aware bake) AND every
#   consecutive pair (incl. home->first, last->home) is A*-connected end to end
#   (not just cell-free), AND every A* path stays below the rack line (max y <
#   9.5) so the base only walks open floor. 1.5 m > goal_tolerance (1.0 m)
#   guarantees the base -- or a fall auto-reset -- always stops in a FREE,
#   replannable cell. build_map re-snaps + margin-checks against the run's own
#   fresh bake before driving; it defaults --waypoint-timeout to 180 s under
#   physics_mode (~= 90/RTF). GT is disabled here (see gt: block) -- ground truth
#   is a kinematic --gt-replay second pass over this run's trajectory.jsonl.
map_name: warehouse_sim_physics
environment:
  usd: assets/environments/warehouse_a.usd
robots:
  - name: hilbert
    spawn: {x: 0.0, y: 0.0, z: 0.55, yaw: 1.57}   # policy stand height (nav_smoke); face +Y
    locomotion: policy
    grasping: magic
# Local-planner / costmap params (NavSpec defaults, pinned to match
# warehouse_nav_smoke.yaml: inflation 0.45 m = Spot half-width ~0.25 + margin).
nav:
  cell_size_m: 0.1
  inflation_radius_m: 0.45
  snap_bound_m: 2.0
  max_lin_speed: 1.0
  max_ang_speed: 1.0
  stuck_timeout_s: 15.0
objects:
  # Same props as warehouse_tour_full.yaml -- lower-corridor floor near origin,
  # observed from the x=-2 aisle and the x=+3 / home passes.
  - id: bag_0
    usd: assets/objects/duffel_bag.usd
    label: bag
    pose: {x: -1.5, y: 5.0, z: 0.0, yaw: 0.52}
  - id: cone_0
    usd: assets/objects/cone.usd
    label: cone
    pose: {x: 1.2, y: 4.2, z: 0.0, yaw: 0.0}
  - id: pipe_0
    usd: assets/objects/pipe.usd
    label: pipe
    pose: {x: -4.5, y: -1.5, z: 0.0, yaw: 1.57}
grasp_radius: 1.5
tour:  # open-floor snake, >=1.5 m clearance + A*-connected, path max y<9.5
  # (Task 17; yaw rad). 18 waypoints. ORDER starts NORTH at the object cluster so
  # the first move is a gentle ~26 deg turn from the +Y-facing spawn (NOT a
  # ~180 deg spin-in-place, which tipped the policy on an earlier attempt --
  # runbook §12.19). Then sweep the y=6 row west and snake the columns south.
  # (-3.3,6.7) is ~2 m from bag_0; (3,6) also views the origin cluster.
  - {x:  -3.3, y:   6.7, yaw:  1.57, dwell_s: 1.5}   # NW, objects (gentle 1st turn)
  - {x:  -8.0, y:   6.0, yaw:  1.57, dwell_s: 1.5}
  - {x: -14.0, y:   6.0, yaw:  1.57, dwell_s: 1.5}
  - {x: -19.0, y:   6.0, yaw:  1.57, dwell_s: 1.5}
  - {x: -24.0, y:   6.0, yaw:  1.57, dwell_s: 1.5}
  - {x: -24.0, y:  -8.0, yaw: -1.57, dwell_s: 1.5}
  - {x: -24.0, y: -21.0, yaw: -1.57, dwell_s: 1.5}
  - {x: -19.0, y: -21.0, yaw:  1.57, dwell_s: 1.5}
  - {x: -19.0, y:  -8.0, yaw:  1.57, dwell_s: 1.5}
  - {x: -14.0, y:  -8.0, yaw: -1.57, dwell_s: 1.5}
  - {x: -14.0, y: -21.0, yaw: -1.57, dwell_s: 1.5}
  - {x:  -8.0, y: -21.0, yaw:  1.57, dwell_s: 1.5}
  - {x:  -8.0, y:  -8.0, yaw:  1.57, dwell_s: 1.5}
  - {x:  -2.0, y:  -8.0, yaw: -1.57, dwell_s: 1.5}
  - {x:  -2.0, y: -21.0, yaw: -1.57, dwell_s: 1.5}
  - {x:   3.0, y: -21.0, yaw:  1.57, dwell_s: 1.5}
  - {x:   3.0, y:  -8.0, yaw:  1.57, dwell_s: 1.5}
  - {x:   3.0, y:   6.0, yaw:  1.57, dwell_s: 1.5}
gt:
  # GT capture is DISABLED for the physics acceptance run. Live Replicator GT
  # annotators (semantic/instance/bbox2d) SIGSEGV inside world.step(render=True)
  # when co-running with PhysX + the warehouse render (reproduced 2x in Task 16;
  # no-GT survives; a semantic_segmentation-only annotator survived 400 physics
  # frames on the SMALL field_smoke scene, so the crash is warehouse-render-
  # specific). See docs/sim_runbook.md §12.19 + task-16-report.md.
  #   -> A2 (Task 17) builds the map with gt disabled here (build_map gt gate
  #      passes when the scenario disables gt), then captures gt/ as a SECOND
  #      pass via sim_app --gt-replay over this run's trajectory.jsonl using the
  #      KINEMATIC twin warehouse_tour_physics_gt.yaml (teleport replay is
  #      kinematic-only by design, so it never hits the physics+GT crash).
  enabled: false
  rate_hz: 2.0
  modalities: [rgb, semantic, instance, bbox2d]
  semantics:
    - {match: ".*SM_Palette.*", class: pallet}          # NOTE: "Palette" spelling
    - {match: ".*SM_CardBox.*", class: box}
    - {match: ".*SM_FireExtinguisher.*", class: fire_extinguisher}
