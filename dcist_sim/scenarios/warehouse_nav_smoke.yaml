# Avoidance smoke scenario (spec §9 GPU smoke #2). A single physics-tier Spot
# (locomotion: policy) navigates the full_warehouse around rack rows, and a
# blocked goal fails cleanly. No tour / no gt / no objects: the smoke
# (scripts/avoidance_smoke.py) drives goals over ROS and reads
# /sim/nav_status + /hilbert/odom -- nothing here needs the GT or grasp paths.
#
# Environment + robot block copied from warehouse_tour.yaml (same
# full_warehouse Nucleus scene, chosen by the 2026-07 probe -- see
# dcist_sim/docs/probe_report_2026-07.md). World bbox measured 2026-07-20 via
# _bounds_probe: X[-28, +8], Y[-41.4, +33.4] -> 36 x 75 m; rack lanes run
# along +Y at x ~= 4, -2, -8, -14, -20, -26 (warehouse_tour_full.yaml).
#
# Spawn (-2, 0): open lane floor near the origin, verified FREE against the
# baked inflated costmap on the first GPU run (2026-07-20). yaw = -1.57 faces
# -Y so the robot starts pointed down the aisle toward the default goal
# (-2, -12), minimising the initial spin-up.
map_name: warehouse_nav_smoke
environment:
  usd: assets/environments/warehouse_a.usd
robots:
  - name: hilbert
    spawn: {x: -2.0, y: 0.0, z: 0.55, yaw: -1.57}
    locomotion: policy
    grasping: magic
# Local-planner / costmap params (dcist_sim_isaac.scenario.NavSpec defaults,
# pinned here for the smoke). inflation_radius 0.45 m = Spot half-width ~0.25
# + margin; cell 0.1 m.
nav:
  cell_size_m: 0.1
  inflation_radius_m: 0.45
  max_lin_speed: 1.0
  max_ang_speed: 1.0
  stuck_timeout_s: 15.0
