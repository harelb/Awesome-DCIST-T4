# Mapping-harness warehouse scenario (spec 2026-07-18). Environment is the
# full_warehouse Nucleus scene picked by the 2026-07 probe (see
# dcist_sim/docs/probe_report_2026-07.md); geometry facts below come from its
# 8 probe renders:
#   - spawn/origin sits near the east brick wall (+X blocked ~5 m out)
#   - the main corridor runs +Y (forklift + stocked racks, frame_01)
#   - a rack aisle runs +Y at x ~= -4 (cones + wet-floor signs, frame_06)
#   - open floor + loading docks to the south/west (frames 02/03/07)
# Object distances follow field_smoke.yaml's finding that the 640x360 SimZed
# contract detects props reliably only inside ~6 m of a viewpoint; every
# object below is within ~5 m of at least one dwelling tour waypoint.
map_name: warehouse_sim_a
environment:
  usd: assets/environments/warehouse_a.usd
robots:
  - name: hilbert
    spawn: {x: 0.0, y: 0.0, z: 0.52, yaw: 1.57}   # keep 0,0: world==odom; face the corridor
    locomotion: kinematic
    grasping: magic
objects:
  # Main-corridor edge; visible from wp0/wp1 (both dwell) at 2-5 m.
  - id: bag_0
    usd: assets/objects/duffel_bag.usd
    label: bag
    pose: {x: -1.5, y: 5.0, z: 0.0, yaw: 0.52}
  # In the spawn view (robot spawns facing +Y), 4.4 m out: e2e_smoke's
  # prerequisite needs >=1 DSG object while the robot is still stationary at
  # spawn (the P1 field scenario placed all objects in the spawn view for
  # exactly this reason), and cone is the reliably-detected class indoors.
  # Also near dwelling wp0, so the mapping tour sees it early.
  - id: cone_0
    usd: assets/objects/cone.usd
    label: cone
    pose: {x: 1.2, y: 4.2, z: 0.0, yaw: 0.0}
  # Rack-aisle edge; visible from wp3/wp4 while driving the aisle.
  - id: pipe_0
    usd: assets/objects/pipe.usd
    label: pipe
    pose: {x: -4.5, y: -1.5, z: 0.0, yaw: 1.57}
grasp_radius: 1.5
tour:  # yaw radians; dwell lets the rate-gated perception frontend catch up
  - {x: 0.0,  y: 3.0,  yaw: 1.57,  dwell_s: 2.0}   # up the main corridor
  - {x: 0.0,  y: 8.0,  yaw: 1.57,  dwell_s: 2.0}   # forklift zone
  - {x: -4.0, y: 8.0,  yaw: 3.14,  dwell_s: 2.0}   # cross to the rack aisle
  - {x: -4.0, y: 2.0,  yaw: -1.57, dwell_s: 2.0}   # down the aisle (cones/signs)
  - {x: -4.0, y: -4.0, yaw: -1.57, dwell_s: 2.0}   # into the open floor
  - {x: 0.0,  y: -4.0, yaw: 0.0,   dwell_s: 2.0}   # east edge, face the wall zone
  - {x: 0.0,  y: 0.0,  yaw: 1.57}                  # home
gt:
  rate_hz: 2.0
  modalities: [rgb, semantic, instance, bbox2d]
  # full_warehouse SHIPS with native semantics (verified in GT output
  # 2026-07-18: forklift, rack, crate, wall, floor, sign, barel[sic], ...),
  # so rules here only fill gaps. A rule matching a natively-tagged prim
  # produces a merged class string (observed: "rack,shelf" before the shelf
  # rule was dropped) -- don't shadow native classes.
  semantics:
    - {match: ".*SM_Palette.*", class: pallet}          # NOTE: "Palette" spelling
    - {match: ".*SM_CardBox.*", class: box}
    - {match: ".*SM_FireExtinguisher.*", class: fire_extinguisher}
