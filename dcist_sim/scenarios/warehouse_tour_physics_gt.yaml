# KINEMATIC GT-replay twin of warehouse_tour_physics.yaml (Task 17, Isaac P4).
#
# WHY THIS FILE EXISTS: the physics acceptance tour (warehouse_tour_physics.yaml)
# runs gt DISABLED because live Replicator GT annotators SIGSEGV under PhysX +
# warehouse render (Task 16, reproduced 2x; docs/sim_runbook.md §12.19). Ground
# truth is instead captured in a SECOND, teleport-driven pass over the physics
# run's recorded trajectory:
#
#   ISAAC_PY -m dcist_sim_isaac.sim_app \
#       --scenario dcist_sim/scenarios/warehouse_tour_physics_gt.yaml \
#       --gt-replay ~/adt4_output/warehouse_sim_physics/trajectory.jsonl \
#       --gt-out   ~/adt4_output/warehouse_sim_physics/gt --headless
#
# sim_app --gt-replay teleports the robot to each trajectory row and captures a
# GT frame -- teleport is deterministic and is KINEMATIC-ONLY by design (the
# schema REJECTS gt.mode 'replay' on a physics/policy robot: teleporting a
# dynamic articulation is undefined). So this twin is `locomotion: kinematic`,
# which reproduces the mapping run's viewpoints via the root-mounted camera and
# NEVER re-enters the physics+GT crash path.
#
# Everything else (environment, objects, gt block) mirrors the physics tour so
# the GT semantics label the identical prims. No `tour` here -- replay drives
# poses from trajectory.jsonl, not the tour list.
map_name: warehouse_sim_physics
environment:
  usd: assets/environments/warehouse_a.usd
robots:
  - name: hilbert
    # Match the physics tour's camera height (0.55) so replayed views line up
    # with the poses the policy robot actually rendered from.
    spawn: {x: 0.0, y: 0.0, z: 0.55, yaw: 1.57}
    locomotion: kinematic
    grasping: magic
objects:
  - id: bag_0
    usd: assets/objects/duffel_bag.usd
    label: bag
    pose: {x: -1.5, y: 5.0, z: 0.0, yaw: 0.52}
  - id: cone_0
    usd: assets/objects/cone.usd
    label: cone
    pose: {x: 1.2, y: 4.2, z: 0.0, yaw: 0.0}
  - id: pipe_0
    usd: assets/objects/pipe.usd
    label: pipe
    pose: {x: -4.5, y: -1.5, z: 0.0, yaw: 1.57}
grasp_radius: 1.5
gt:
  enabled: true
  mode: replay
  rate_hz: 2.0
  modalities: [rgb, semantic, instance, bbox2d]
  semantics:
    - {match: ".*SM_Palette.*", class: pallet}          # NOTE: "Palette" spelling
    - {match: ".*SM_CardBox.*", class: box}
    - {match: ".*SM_FireExtinguisher.*", class: fire_extinguisher}
