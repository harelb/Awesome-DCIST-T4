# Task 13: physics-tier grasp smoke scenario. A copy of field_smoke.yaml with
# the robot switched to `locomotion: policy` (PhysX walking policy, Task 8) +
# `grasping: physics` (G1 IK-reach grasp, Task 13). Objects/poses are identical
# to field_smoke.yaml -- they are within the arm's reach once the robot walks
# adjacent (grasp_smoke.py drives to ~0.7 m of cone_0, well inside the
# reach_m=0.984 arm reach measured from the base).
#
# `grasping: physics` (or `locomotion: policy`) makes this a PHYSICS-MODE
# scenario (scenario.py `physics_mode`): the World runs at 500 Hz physics /
# 60 Hz render (Task 6), objects spawn DYNAMIC (stage._make_dynamic) so the
# grasp backend's set_kinematic(True/False) attach/detach is meaningful, and a
# costmap is baked for the policy planner (Task 9).
#
# Spawn z=0.55 is the policy standing height (drive_backends.POLICY_STANDING_Z);
# the robot drops onto its feet during the settle phase. See field_smoke.yaml's
# header for the object-distance rationale (unchanged here).
# Task 15e: publish Isaac's ground-truth semantic LABEL image on
# .../semantic/gt_image_raw so the isaac_sim hydra overlay places DSG object
# nodes from pixel-perfect GT masks (collapses the range-dependent FastSAM
# localization bias root-caused in runbook §12.11 that blocked the A1 pick).
# Opt-in; only affects hydra's object mapping, not the executor's own YOLOE
# detection gate (spot_executor reads the RGB topic directly). See §12.12.
gt_semantics_pub: true
# Task 15k: object footprints are bounds-derived (a wide asset like the duffel
# bag gets a disc covering its real XY axis-extent, not a global 0.25 m), which
# is the effective fix for the 15j onto-bag topple (the base no longer arrives
# on the object). The goal-snap standoff is left at 0 here: with the bag and
# cone only ~1.35 m apart, any extra standoff on top of the (already ample)
# bounds footprint over-pushed the goto-poi staging point into the neighbouring
# object's basin, so the goal-blind grasp target selection picked the wrong
# (nearer) object and the pick failed out-of-reach (measured, 15k acceptance).
# Snapping to the nearest free cell on the inflated footprint edge keeps the
# base as close to the TARGET as topple-safe; the grasp align phase
# (ALIGN_STANDOFF_M 0.78 m) does the final close approach. Other nav params
# keep the physics defaults (cell 0.1, inflation 0.45 m = Spot half-width
# ~0.25 + margin).
nav:
  snap_standoff_m: 0.0
environment:
  usd: assets/environments/field_a.usd
robots:
  - name: hilbert
    spawn: {x: 0.0, y: 0.0, z: 0.55, yaw: 0.0}
    locomotion: policy
    grasping: physics
objects:
  - id: bag_0
    usd: assets/objects/duffel_bag.usd
    label: bag
    pose: {x: 5.0, y: 0.6, z: 0.0, yaw: 0.52}
  - id: cone_0
    usd: assets/objects/cone.usd
    label: cone
    pose: {x: 4.0, y: 1.6, z: 0.0, yaw: 0.0}
  - id: pipe_0
    usd: assets/objects/pipe.usd
    label: pipe
    pose: {x: 5.6, y: -1.6, z: 0.0, yaw: 1.57}
grasp_radius: 1.5
