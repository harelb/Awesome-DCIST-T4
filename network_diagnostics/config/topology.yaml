---
networks:
  mit_wifi:
    subnet: 10.28.0.0/14  # MIT WiFi hands out both 10.29.x and 10.31.x
  penn_wifi:
    subnet: 192.168.129.0/24
  silvus:
    subnet: 192.168.100.0/24
machines:
  euclid:
    role: robot
    color: "#e6194b"
    platform_id: smaug
    platform_type: spot
    desc: Smaug Jockey
    addresses:
      mit_wifi: 10.29.152.15
      penn_wifi: 192.168.129.234
      silvus: 192.168.100.3
  hamilton:
    role: robot
    color: "#42d4f4"
    addresses:
      mit_wifi: 10.29.236.1
      silvus: 192.168.100.2
      penn_wifi: 192.168.129.210
    platform_id: topaz
    platform_type: spot
    desc: Topaz Jockey
  gauss:
    role: robot
    color: "#ffe119"
    platform_id: samoyed
    platform_type: phoenix
    desc: Husky Jockey
    addresses:
      mit_wifi: 10.31.168.179
      silvus: 192.168.100.4
  lewis:
    role: robot
    color: "#3cb44b"
    platform_id: samoyed
    platform_type: phoenix
    desc: Husky Jockey
    addresses:
      mit_wifi: 10.29.202.81
      penn_wifi: 192.168.129.218
      silvus: 192.168.100.105
  apollo:
    role: robot
    color: "#f032e6"
    platform_id: apollo
    platform_type: spot
    desc: ARL Spot
    addresses:
      silvus: 192.168.100.13
  samoyed:
    role: robot
    color: "#f58231"
    platform_id: samoyed
    platform_type: phoenix
    desc: ARL Husky
    addresses:
      silvus: 192.168.100.62
  bonsai:
    role: base_station
    desc: RRG dev computer
    addresses:
      penn_wifi: 192.168.129.217
  willow:
    role: base_station
    addresses:
      mit_wifi: 10.31.132.194
      silvus: 192.168.100.100
    desc: RRG base station
  sequia:
    role: base_station
    desc: Sequia base station
    addresses:
      mit_wifi: 10.29.166.252
      silvus: 192.168.100.105
silvus_radios:
  mgmt_subnet: 172.20.0.0/16
  api_endpoint: /cgi-bin/streamscape_api
  radios:
    # SC4200H pair added 2026-10-20 (hamilton / willow). 65631's mgmt IP is in
    # 172.17.0.0/16, which docker0 also uses on both machines
    radio_65631:
      mgmt_ip: 172.17.0.95
      node_id: 65631
    radio_310308:
      mgmt_ip: 172.20.188.36
      node_id: 310308
  udp_telemetry:
    listen_port: 5100
zenoh:
  port: 7447
  connect_network: silvus  # robot <-> base links (a launch can pick another network)
  fleetlink_port: 7450  # dedicated fleetlink router on the base (fleet_link: fleetlink)
  fleetlink_networks: [silvus]  # robot agents try these in order (failover); radio only
ssh:
  base_station_user: rrg
  robot_user: swarm
fleet_defaults:
  spot_platforms: [smaug, topaz]
  sessions:
    mapping:
      spot: spot-default
      phoenix: phoenix-default
    relocalize:
      spot: spot_relocalize-relocalize
      phoenix: phoenix_relocalize-relocalize
  base_station_session: base_station_heracles-default
  output_root: ~/adt4_output
  fleet_link: fleetlink  # router: rmw_zenohd router-to-router | fleetlink: only fleetlink crosses the radio
  fleetlink_base: willow  # base station that runs the fleetlink router
